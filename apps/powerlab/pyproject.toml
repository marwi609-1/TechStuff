[project]
name = "powerlab"
version = "0.1.0"
description = "Leistungsdaten-Analyse für den Radsport (NP, IF, TSS, PMC, CP, W'bal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Eingebettetes HTML/CSS/SVG: Umbrüche in Markup-Strings verschlechtern die Lesbarkeit
"src/powerlab/report.py" = ["E501"]
