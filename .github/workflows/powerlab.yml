name: powerlab

on:
  pull_request:
    paths:
      - "apps/powerlab/**"
      - ".github/workflows/powerlab.yml"
  push:
    branches: [main]
    paths:
      - "apps/powerlab/**"
      - ".github/workflows/powerlab.yml"

permissions:
  contents: read

concurrency:
  group: powerlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/powerlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/powerlab/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
